<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="100%" height="100%">
  <!-- Logomark (Projector Icon) -->
  <g transform="translate(30, 0)">
    <!-- Projector Body -->
    <rect x="60" y="130" width="280" height="140" rx="16" fill="#1e293b" />
    
    <!-- Projector Lens Outer -->
    <circle cx="270" cy="200" r="50" fill="#334155" />
    <!-- Projector Lens Inner -->
    <circle cx="270" cy="200" r="35" fill="#f1f5f9" />
    <circle cx="270" cy="200" r="20" fill="#3b82f6" />
    
    <!-- Light Beam / Rays -->
    <path d="M 330 180 L 400 130 L 400 270 L 330 220 Z" fill="#3b82f6" opacity="0.25" />
    <path d="M 330 180 L 420 120 L 420 280 L 330 220 Z" fill="#60a5fa" opacity="0.15" />
    
    <!-- Ventilation / Detail Lines -->
    <rect x="90" y="160" width="100" height="8" rx="4" fill="#334155" />
    <rect x="90" y="185" width="100" height="8" rx="4" fill="#334155" />
    <rect x="90" y="210" width="70" height="8" rx="4" fill="#334155" />
    <rect x="90" y="235" width="70" height="8" rx="4" fill="#334155" />
    
    <!-- Projector Feet -->
    <rect x="90" y="270" width="16" height="8" rx="2" fill="#475569" />
    <rect x="250" y="270" width="16" height="8" rx="2" fill="#475569" />
  </g>

  <!-- Logotype / Wordmark (INVENTA + Subtitle) -->
  <g transform="translate(480, 235)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="135" font-weight="900" fill="#0f172a" letter-spacing="-3">INVENTA</text>
    <text x="6" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#64748b" letter-spacing="6">INVENTORY &amp; ASSET MANAGEMENT</text>
  </g>
</svg>
